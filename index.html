<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" />
      <a
        class="header-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <div id="add-task">
        <label for="new-task">Add Item</label>
        <div class="task-wrapper">
          <input id="new-task" class="task" type="text" />
          <button>Add</button>
        </div>
      </div>
      <h3>Todo</h3>
      <ul id="incomplete-task">
        <li>
          <input type="checkbox" />
          <label class="incompleted-task">Pay Bills</label>
          <input type="text" class="incompleted-task" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox" />
          <label for="edit-task">Go Shopping</label>
          <input type="text" value="Go Shopping" class="edit-task" />
          <button class="edit-button">Save</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked />
          <label class="completed-task">See the Doctor</label>
          <input type="text" class="completed-task" />
          <button class="edit-button">Edit</button>
          <button class="delete-button">
            <img src="./remove.svg" />
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
