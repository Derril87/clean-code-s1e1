<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="header">
      <img
        class="header__image"
        src="./eisenhower-matrix.jpg"
        alt="header-picture"
      />
      <a
        class="header__info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="task-add">
        <label for="newTask" class="task-add__label">Add Item</label>
        <div class="task-add__wrapper">
          <input id="newTask" class="task-add__input" type="text" />
          <button class="main__button-add">Add</button>
        </div>
      </section>
      <section>
        <h3>Todo</h3>
        <ul id="incomplete-tasks">
          <li>
            <input type="checkbox" class="task__checkbox" />
            <label class="task">Pay Bills</label>
            <input type="text" class="task task__input" />
            <button class="button-edit">Edit</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
          <li class="edit-mode">
            <input type="checkbox" class="task__checkbox" />
            <label class="task task__input">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task edit-task" />
            <button class="button-edit">Save</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3>Completed</h3>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" class="task__checkbox" checked />
            <label class="task task_done">See the Doctor</label>
            <input type="text" class="task task__input" />
            <button class="button-edit">Edit</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
