<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body>
    <header class="header">
      <img
        class="header__image"
        src="./eisenhower-matrix.jpg"
        alt="header-picture"
      />
      <a
        class="header__info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section id="add-task" class="task-add">
        <label for="new-task" class="task-add__label">Add Item</label>
        <div class="task-add__wrapper">
          <input id="new-task" class="task-add__input" type="text" />
          <button>Add</button>
        </div>
      </section>
      <section class="task-list">
        <h3>Todo</h3>
        <ul id="incomplete-task">
          <li>
            <input type="checkbox" class="task__checkbox" />
            <label class="task">
              <input type="text" class="task__input" />
              Pay Bills
            </label>
            <button class="button-edit">Edit</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
          <li class="edit-mode">
            <input type="checkbox" class="task__checkbox" />
            <label class="task-label edit-label">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="task"
              id="edit-task"
            />
            <button class="edit-button">Save</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h3>Completed</h3>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" class="task__checkbox" checked />
            <label class="task-completed__label task-completed__label_done"
              >See the Doctor</label
            >
            <input type="text" class="task task__input" />
            <button class="edit-button">Edit</button>
            <button class="button-delete">
              <img
                src="./remove.svg"
                alt="remove-icon"
                class="button-delete__icon"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
